<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mytcgb</title>
    <link rel="icon" type="image/png" href="img/logo/icon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/binders.css">
    <link rel="stylesheet" href="css/wishlist.css">
</head>
<body>
    <header>
        <img src="img/logo/exp.png" alt="Logotipo de myptcgb">
        <nav class="nav-buttons">
            <a href="" class="active">Inicio</a>
            <a href="about">Créditos</a>
        </nav>
    </header>
    <main>
        <h1>Selecciona un binder:</h1>
        <hr size="1">
        <p>
            En esta página podrás consultar mis álbumes actualizados en tiempo real.
        </p>
        <div id="binders-container">
            <div id="binder-book" class="binder-book"></div>

            <div class="binder-controls">
                <div class="album-select-container">
                    <span>Álbum:</span>
                    <button type="button" id="open-album-modal-btn" class="editor-input" style="cursor: pointer; font-weight: bold; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <span id="album-selected-name">Gamegenic (2x2)</span>
                        <span style="font-size: 10px; color: #8b949e;">▼</span>
                    </button>

                    <select id="album-select" style="display: none;">
                        <option value="json/gamegenic2x2.json" data-grid="2x2" data-id="gamegenic">Gamegenic (2x2)</option>
                        <option value="json/ultrapro-megagengar-2x2.json" data-grid="2x2" data-id="megagengar">UltraPRO Mega-Gengar (2x2 + Jumbo)</option>
                        <option value="json/ultrapro-tinkaton-3x3.json" data-grid="3x3" data-id="tinkaton">UltraPRO Tinkaton (3x3)</option>
                        <option value="json/holo3x3.json" data-grid="3x3" data-id="holo">Álbum Holo (3x3)</option>
                        <option value="json/ultrapro-megportf-1x1.json" data-grid="2x2" data-id="portfmeg">Portfolio Megaevolución (1x1)</option>
                        <option value="json/escanirr.json" data-grid="3x3" data-id="escanirr" hidden>Escanirr (3x3)</option>
                        <option value="json/wishlist.json" data-grid="3x3" data-id="wishlist">Wishlist</option>
                    </select>
                </div>

                <div class="view-mode-container" id="view-mode-container">
                    <span>Vista:</span>
                    <select id="view-mode-select">
                        <option value="double" selected>Dos páginas</option>
                        <option value="single">Una página</option>
                    </select>
                </div>

                <div class="nav-buttons-container">
                    <button id="prev-btn" class="nav-btn">◀ Anterior</button>
                    <div class="page-select-container">
                        <span>Pág:</span>
                        <input type="text" id="page-input" autocomplete="off" value="1">
                        <span id="total-pages-label">/ 1</span>
                    </div>
                    <button id="next-btn" class="nav-btn">Siguiente ▶</button>
                </div>

                <button id="open-search-modal-btn" class="nav-btn">Búsqueda avanzada</button>
            </div>
        </div>
    </main>
    <footer>
        <b>&copy; <a target="_blank" href="https://github.com/markelcanton/" title="https://github.com/markelcanton/">Markel Cantón</a> &#8226; 2026</b>
    </footer>

    <div id="card-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body" class="modal-grid"></div>
        </div>
    </div>

    <!-- MODAL DE VARIANTES: CADA VARIANTE EN SU PROPIO BOX CON SU BOTÓN CARDMARKET -->
    <div id="variant-detail-modal" class="modal-overlay" style="display: none; z-index: 2500;">
        <div class="editor-modal-content" style="max-width: 650px;">
            <div class="editor-modal-header">
                <h2 id="variant-modal-title">Variantes disponibles:</h2>
                <span id="close-variant-modal" class="close-btn-editor">&times;</span>
            </div>
            <!-- Contenedor donde se insertarán verticalmente los boxes de cada variante -->
            <div id="variant-boxes-container" class="editor-modal-body" style="gap: 15px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
    </div>

    <div id="search-modal" class="modal-overlay" style="display: none;">
        <div class="editor-modal-content">
            <div class="editor-modal-header">
                <h2>Búsqueda avanzada:</h2>
                <span id="close-search-modal" class="close-btn-editor">&times;</span>
            </div>
            
            <div class="editor-modal-body">
                <div class="editor-section">
                    <div class="form-group">
                        <label>Nombre de carta / Pokémon:</label>
                        <input type="text" id="search-query" class="editor-input" autocomplete="off" placeholder="Riolu">
                    </div>
                </div>

                <div class="editor-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expansión:</label>
                            <button type="button" id="open-expansion-modal-btn" class="btn-editor-primary" style="width: 100%;">+ Seleccionar expansiones</button>
                            <div id="expansion-tags" class="tags-container"></div>
                        </div>
                        <div class="form-group">
                            <label>Código de carta:</label>
                            <input type="text" id="filter-code" class="editor-input" autocomplete="off" placeholder="MEG001">
                        </div>
                    </div>

                    <div class="checkbox-row">
                        <label class="editor-checkbox"><input type="checkbox" id="filter-notrade"> No Trade</label>
                        <label class="editor-checkbox"><input type="checkbox" id="filter-reserved"> Reservada</label>
                        <label class="editor-checkbox"><input type="checkbox" id="filter-sold"> Vendida</label>
                        <label class="editor-checkbox"><input type="checkbox" id="filter-traded"> Traded</label>
                        <label class="editor-checkbox"><input type="checkbox" id="filter-unavailable"> No Disponible</label>
                    </div>
                </div>

                <div class="editor-section-title">Tipo de carta:</div>
                <div class="editor-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Idioma:</label>
                            <button type="button" id="open-language-modal-btn" class="btn-editor-primary" style="width: 100%;">+ Seleccionar idiomas</button>
                            <div id="language-tags" class="tags-container"></div>
                        </div>
                        <div class="form-group">
                            <label>Regulación:</label>
                            <input type="text" id="filter-format" class="editor-input" placeholder="H, I, J...">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Estado:</label>
                            <button type="button" id="open-condition-modal-btn" class="btn-editor-primary" style="width: 100%;">+ Seleccionar estados</button>
                            <div id="condition-tags" class="tags-container"></div>
                        </div>
                        <div class="form-group">
                            <label>Precio máximo (€):</label>
                            <input type="number" id="filter-price" step="0.01" autocomplete="off" class="editor-input" placeholder="0,02€">
                        </div>
                        <div class="form-group">
                            <label>Stock mínimo:</label>
                            <input type="number" id="filter-stock" min="1" autocomplete="off" class="editor-input" placeholder="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Tipo y rareza:</label>
                        <button type="button" id="open-type-modal-btn" class="btn-editor-primary" style="width: 100%;">+ Seleccionar tipo / rareza</button>
                        <div id="type-tags" class="tags-container"></div>
                    </div>
                </div>
            </div>

            <div class="editor-modal-footer">
                <button id="reset-filters-btn" class="btn-editor-danger">Restablecer filtros</button>
                <button id="apply-filters-btn" class="btn-editor-primary">Buscar</button>
            </div>
        </div>
    </div>

    <div id="generic-selector-modal" class="modal-overlay" style="display: none; z-index: 100000;">
        <div class="editor-modal-content" style="max-width: 750px; height: 85vh;">
            <div class="editor-modal-header">
                <h2 id="generic-modal-title">Seleccionar:</h2>
                <span id="close-generic-modal" class="close-btn-editor">&times;</span>
            </div>
            <div class="editor-modal-body" style="display:flex; flex-direction:column; gap:12px;">
                <input type="text" id="generic-search-input" class="editor-input" placeholder="Buscar..." autocomplete="off">
                
                <div id="set-tabs-container" style="display:flex; gap:8px; flex-wrap:wrap; border-bottom: 1px solid #21262d; padding-bottom: 8px;"></div>

                <div id="series-select-wrapper" style="display:flex; flex-direction:column; gap:4px;">
                    <label id="series-label-text" style="font-size: 13px; color: #8b949e; font-weight: bold;">Serie:</label>
                    <select id="series-dropdown-select" class="editor-input" style="cursor: pointer; margin: 0;"></select>
                </div>

                <div id="generic-grid-container" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px; overflow-y:auto; padding-right:4px; flex:1;"></div>
            </div>
            <div class="editor-modal-footer">
                <button type="button" id="confirm-generic-selection" class="btn-editor-primary">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="results-modal" class="modal-overlay" style="display: none;">
        <div class="editor-modal-content">
            <div class="editor-modal-header">
                <h2>Resultados de la búsqueda:</h2>
                <span id="close-results-modal" class="close-btn-editor">&times;</span>
            </div>
            <div class="editor-modal-body">
                <div class="sort-controls-container" style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; background: #0d1117; padding: 10px 14px; border-radius: 8px; border: 1px solid #21262d;">
                    <label for="search-sort-select" style="font-size: 13px; color: #8b949e; font-weight: bold; white-space: nowrap;">Ordenar por:</label>
                    <select id="search-sort-select" class="editor-input" style="flex: 1; margin: 0; cursor: pointer;">
                        <option value="page-asc" selected>Página y slot (de menor a mayor)</option>
                        <option value="page-desc">Página y slot (de mayor a menor)</option>
                        <option value="price-asc">Precio (de menor a mayor)</option>
                        <option value="price-desc">Precio (de mayor a menor)</option>
                        <option value="name-asc">Nombre (A-Z)</option>
                        <option value="name-desc">Nombre (Z-A)</option>
                        <option value="exp-desc">Expansión (de más reciente a antigua)</option>
                        <option value="exp-asc">Expansión (de más antigua a reciente)</option>
                    </select>
                </div>
                <div id="search-results-grid" class="search-results-grid"></div>
            </div>
            <div class="editor-modal-footer">
                <button id="back-to-search-btn" class="btn-editor-primary">Volver a buscar</button>
            </div>
        </div>
    </div>
</body>
<script src="js/loadfade.js"></script>
<script src="js/binders.js"></script>
</html>
